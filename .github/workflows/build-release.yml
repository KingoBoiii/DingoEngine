name: Build release

# Disabled for now: run by hand from the Actions tab, on a release tag
on: workflow_dispatch

permissions:
  contents: write

env:
  SOLUTION_FILE_PATH: 'DingoEngine.slnx'

jobs:
  build-windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        build-configuration: [Debug, Release, Distribution]
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        lfs: true
        fetch-depth: 0

    - uses: ./.github/actions/setup-windows
      with:
        msbuild: true

    - name: Get version
      id: version
      run: |
        $tag = "${{ github.ref_name }}"
        if ($tag -cnotmatch '^v\d+\.\d+\.\d+(-rc\.\d+)?$') {
          Write-Host "::error::Tag $tag must look like vX.Y.Z or vX.Y.Z-rc.N"
          exit 1
        }
        $ver = $tag.TrimStart('v')
        $parts = $ver.Split('-')[0].Split('.')
        $commits = git rev-list --count HEAD
        echo "VERSION=$ver.$commits" >> $env:GITHUB_OUTPUT
        echo "VERSION_MAJOR=$($parts[0])" >> $env:GITHUB_OUTPUT
        echo "VERSION_MINOR=$($parts[1])" >> $env:GITHUB_OUTPUT
        echo "VERSION_PATCH=$($parts[2])" >> $env:GITHUB_OUTPUT
        echo "VERSION_BUILD=$commits" >> $env:GITHUB_OUTPUT

    - name: Premake
      working-directory: ${{env.GITHUB_WORKSPACE}}
      env:
        DE_VERSION: ${{steps.version.outputs.VERSION_MAJOR}}.${{steps.version.outputs.VERSION_MINOR}}.${{steps.version.outputs.VERSION_PATCH}}
        DE_BUILD_NUMBER: ${{steps.version.outputs.VERSION_BUILD}}
      run: premake5 vs2026

    - name: Build
      working-directory: ${{env.GITHUB_WORKSPACE}}
      run: msbuild ${{env.SOLUTION_FILE_PATH}} /m /p:Configuration=${{matrix.build-configuration}} /p:PlatformToolset=v143 -fl -flp:logfile=logs/Build-${{matrix.build-configuration}}.log

    # Distribution executables are built with their PDBs (premake's distributionSymbols) so a
    # player's minidump can be read, but a PDB never ships in a game: they all move into one
    # symbols archive. The engine's Distribution library is built without debug info.
    - name: Collect Distribution symbols
      if: matrix.build-configuration == 'Distribution'
      run: |
        Get-ChildItem .\build\bin\Distribution-windows-x86_64 -Directory | Where-Object { $_.Name -ne 'DingoEngine' } | ForEach-Object {
          $pdbs = @(Get-ChildItem $_.FullName -Filter *.pdb)
          if ($pdbs.Count) {
            New-Item -ItemType Directory -Force ".\symbols\$($_.Name)" | Out-Null
            $pdbs | Move-Item -Destination ".\symbols\$($_.Name)"
          }
        }

    # Each example ships its executable and DLLs beside <Example>.dpak (its assets, packed and
    # encrypted with its dpak.key), THIRD-PARTY-NOTICES.md and the licence files at the root of its
    # assets, never assets\.
    - name: Pack example assets
      if: matrix.build-configuration == 'Distribution'
      run: |
        Get-ChildItem .\examples -Directory | ForEach-Object {
          $example = $_.Name
          $bin = ".\build\bin\Distribution-windows-x86_64\$example"
          .\scripts\pack-assets.ps1 -Example $example -Output "$bin\$example.dpak" -Configuration Distribution
          Get-ChildItem "$($_.FullName)\assets" -File | Where-Object { $_.Name -match 'licen[cs]e' } | Copy-Item -Destination $bin
          Copy-Item .\THIRD-PARTY-NOTICES.md -Destination $bin
        }

    # Ship the self-contained lib (engine + all vendor libs merged by the
    # lib.exe post-build step) instead of the engine-only lib.
    - name: Use merged self-contained lib
      run: Copy-Item ".\build\dist\${{matrix.build-configuration}}-windows-x86_64\DingoEngine.lib" ".\build\bin\${{matrix.build-configuration}}-windows-x86_64\DingoEngine\DingoEngine.lib" -Force

    - name: Copy include files
      run: |
        Copy-Item .\THIRD-PARTY-NOTICES.md .\build\bin\${{matrix.build-configuration}}-windows-x86_64\DingoEngine\
        robocopy .\include .\build\bin\${{matrix.build-configuration}}-windows-x86_64\DingoEngine\include /e /z
        if ($lastexitcode -lt 8) { exit 0 } else { exit 1 }

    - name: Copy glm files (third-party)
      run: |
        robocopy .\vendor\glm .\build\bin\${{matrix.build-configuration}}-windows-x86_64\DingoEngine\glm /e /z
        if ($lastexitcode -lt 8) { exit 0 } else { exit 1 }

    - name: Copy DingoPack
      run: |
        $config = "${{ matrix.build-configuration }}"
        robocopy ".\build\bin\$config-windows-x86_64\DingoPack" ".\build\bin\$config-windows-x86_64\DingoEngine\tools\DingoPack" *.exe *.dll /z
        if ($lastexitcode -lt 8) { exit 0 } else { exit 1 }

    - name: Create ZIP archive
      run: |
        $config = "${{ matrix.build-configuration }}"
        $srcDir = ".\build\bin\$config-windows-x86_64\DingoEngine"
        $zipName = "DingoEngine-${{steps.version.outputs.VERSION}}-$config-windows-x86_64.zip"
        Compress-Archive -Path "$srcDir\*" -DestinationPath ".\$zipName" -Force

    - name: Upload to GitHub Release
      run: |
        $config = "${{ matrix.build-configuration }}"
        $zipName = "DingoEngine-${{steps.version.outputs.VERSION}}-$config-windows-x86_64.zip"
        gh release upload "${{ github.ref_name }}" "$zipName" --clobber
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload Distribution symbols to GitHub Release
      if: matrix.build-configuration == 'Distribution'
      run: |
        $zipName = "DingoEngine-${{steps.version.outputs.VERSION}}-Distribution-symbols-windows-x86_64.zip"
        if (-not (Test-Path .\symbols)) { Write-Error 'No Distribution PDB was collected' }
        Compress-Archive -Path ".\symbols\*" -DestinationPath ".\$zipName" -Force
        gh release upload "${{ github.ref_name }}" "$zipName" --clobber
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload static library artifact
      uses: actions/upload-artifact@v4
      with:
        name: dingo-engine-windows-${{matrix.build-configuration}}-${{steps.version.outputs.VERSION}}
        path: .\build\bin\${{matrix.build-configuration}}-windows-x86_64\DingoEngine

    - name: Upload FlappyBird binary
      if: matrix.build-configuration == 'Distribution'
      uses: actions/upload-artifact@v4
      with:
        name: flappybird-binary-windows
        path: .\build\bin\Distribution-windows-x86_64\FlappyBird

    - name: Upload Dungeon Crawler binary
      if: matrix.build-configuration == 'Distribution'
      uses: actions/upload-artifact@v4
      with:
        name: dungeoncrawler-binary-windows
        path: .\build\bin\Distribution-windows-x86_64\DungeonCrawler

    - name: Upload Breakout 3D binary
      if: matrix.build-configuration == 'Distribution'
      uses: actions/upload-artifact@v4
      with:
        name: breakout3d-binary-windows
        path: .\build\bin\Distribution-windows-x86_64\Breakout3D

    - name: Upload Space Invaders binary
      if: matrix.build-configuration == 'Distribution'
      uses: actions/upload-artifact@v4
      with:
        name: space-invaders-binary-windows
        path: .\build\bin\Distribution-windows-x86_64\SpaceInvaders

    - name: Upload Angry Birds binary
      if: matrix.build-configuration == 'Distribution'
      uses: actions/upload-artifact@v4
      with:
        name: angrybirds-binary-windows
        path: .\build\bin\Distribution-windows-x86_64\AngryBirds

    - name: Upload Dungeon Crawler 3D binary
      if: matrix.build-configuration == 'Distribution'
      uses: actions/upload-artifact@v4
      with:
        name: dungeoncrawler3d-binary-windows
        path: .\build\bin\Distribution-windows-x86_64\DungeonCrawler3D

    - name: Upload Echo Vault binary
      if: matrix.build-configuration == 'Distribution'
      uses: actions/upload-artifact@v4
      with:
        name: echovault-binary-windows
        path: .\build\bin\Distribution-windows-x86_64\EchoVault

    - name: Upload Arena Shooter binary
      if: matrix.build-configuration == 'Distribution'
      uses: actions/upload-artifact@v4
      with:
        name: arenashooter-binary-windows
        path: .\build\bin\Distribution-windows-x86_64\ArenaShooter

    - name: Upload Candlewick binary
      if: matrix.build-configuration == 'Distribution'
      uses: actions/upload-artifact@v4
      with:
        name: candlewick-binary-windows
        path: .\build\bin\Distribution-windows-x86_64\Candlewick

    - name: Upload Marionette binary
      if: matrix.build-configuration == 'Distribution'
      uses: actions/upload-artifact@v4
      with:
        name: marionette-binary-windows
        path: .\build\bin\Distribution-windows-x86_64\Marionette

