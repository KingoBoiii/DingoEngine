        echo "VERSION_PATCH=$($parts[2])" >> $env:GITHUB_OUTPUT
        echo "VERSION_BUILD=$commits" >> $env:GITHUB_OUTPUT

    - name: Create ZIP archive
      run: |
        $zipName = "Candlewick-${{steps.version.outputs.VERSION}}-windows-x86_64.zip"
        Compress-Archive -Path ".\candlewick\*" -DestinationPath ".\$zipName" -Force

    - name: Upload to GitHub Release
      run: gh release upload "${{ github.ref_name }}" "Candlewick-${{steps.version.outputs.VERSION}}-windows-x86_64.zip" --clobber
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: candlewick-windows-distribution-${{steps.version.outputs.VERSION}}
        path: .\candlewick

  example-game-marionette:
    needs: build-windows
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
      with:
        lfs: true
        submodules: false
        fetch-depth: 0

    - name: Download Marionette binary
      uses: actions/download-artifact@v4
      with:
        name: marionette-binary-windows
        path: .\marionette

    - name: Get version
      id: version
      run: |
        $tag = "${{ github.ref_name }}"
        if ($tag -cnotmatch '^v\d+\.\d+\.\d+(-rc\.\d+)?$') {
          Write-Host "::error::Tag $tag must look like vX.Y.Z or vX.Y.Z-rc.N"
          exit 1
        }
        $ver = $tag.TrimStart('v')
        $parts = $ver.Split('-')[0].Split('.')
        $commits = git rev-list --count HEAD
        echo "VERSION=$ver.$commits" >> $env:GITHUB_OUTPUT
        echo "VERSION_MAJOR=$($parts[0])" >> $env:GITHUB_OUTPUT
        echo "VERSION_MINOR=$($parts[1])" >> $env:GITHUB_OUTPUT
        echo "VERSION_PATCH=$($parts[2])" >> $env:GITHUB_OUTPUT
        echo "VERSION_BUILD=$commits" >> $env:GITHUB_OUTPUT

    - name: Create ZIP archive
      run: |
        $zipName = "Marionette-${{steps.version.outputs.VERSION}}-windows-x86_64.zip"
        Compress-Archive -Path ".\marionette\*" -DestinationPath ".\$zipName" -Force

    - name: Upload to GitHub Release
      run: gh release upload "${{ github.ref_name }}" "Marionette-${{steps.version.outputs.VERSION}}-windows-x86_64.zip" --clobber
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: marionette-windows-distribution-${{steps.version.outputs.VERSION}}
        path: .\marionette

  build-linux:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        build-configuration: [Debug, Release, Distribution]

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        lfs: true
        fetch-depth: 0

    - uses: ./.github/actions/setup-linux

    - name: Get version
      id: version
      run: |
        if ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
          echo "::error::Tag $GITHUB_REF_NAME must look like vX.Y.Z or vX.Y.Z-rc.N"
          exit 1
        fi
        ver="${GITHUB_REF_NAME#v}"
        IFS=. read -r major minor patch <<< "${ver%%-*}"
        commits=$(git rev-list --count HEAD)
        {
          echo "VERSION=$ver.$commits"
          echo "VERSION_MAJOR=$major"
          echo "VERSION_MINOR=$minor"
          echo "VERSION_PATCH=$patch"
          echo "VERSION_BUILD=$commits"
        } >> "$GITHUB_OUTPUT"

    - name: Premake
      env:
        DE_VERSION: ${{steps.version.outputs.VERSION_MAJOR}}.${{steps.version.outputs.VERSION_MINOR}}.${{steps.version.outputs.VERSION_PATCH}}
        DE_BUILD_NUMBER: ${{steps.version.outputs.VERSION_BUILD}}
      run: premake5 gmake

    - name: Build
      run: make -j"$(nproc)" config="$(echo '${{ matrix.build-configuration }}' | tr '[:upper:]' '[:lower:]')"

    # The merged libDingoEngine.a (engine + every vendor lib + assimp, made by the engine's
    # post-build step), the headers and glm, like the Windows ZIP. Consumers link it with the
    # Vulkan SDK's shaderc_combined and spirv-cross-{hlsl,glsl,core}, plus z, dl and pthread.
    - name: Package engine
      run: |
        config="${{ matrix.build-configuration }}"
        pkg="build/package/DingoEngine-$config"
        mkdir -p "$pkg"
        cp "build/dist/$config-linux-x86_64/libDingoEngine.a" "$pkg/"
        cp -r include THIRD-PARTY-NOTICES.md "$pkg/"
        cp -r vendor/glm "$pkg/glm"
        mkdir -p "$pkg/tools"
        cp "build/bin/$config-linux-x86_64/DingoPack/DingoPack" "$pkg/tools/"
        tar -czf "DingoEngine-${{steps.version.outputs.VERSION}}-$config-linux-x86_64.tar.gz" -C "$pkg" .

    - name: Upload engine to GitHub Release
      run: gh release upload "${{ github.ref_name }}" "DingoEngine-${{steps.version.outputs.VERSION}}-${{ matrix.build-configuration }}-linux-x86_64.tar.gz" --clobber
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload engine artifact
      uses: actions/upload-artifact@v4
      with:
        name: dingo-engine-linux-${{matrix.build-configuration}}-${{steps.version.outputs.VERSION}}
        path: build/package/DingoEngine-${{ matrix.build-configuration }}

    # Each example as <Program>/ holding the executable beside <Program>.dpak, the test framework
    # beside its loose assets/. assimp is linked statically, so at run time they need only
    # libvulkan1 and a Vulkan driver.
    - name: Package examples and test framework
      if: matrix.build-configuration == 'Distribution'
      run: scripts/package-linux-programs.sh Distribution build/package/programs "${{steps.version.outputs.VERSION}}"

    - name: Upload examples and test framework to GitHub Release
      if: matrix.build-configuration == 'Distribution'
      run: gh release upload "${{ github.ref_name }}" build/package/programs/*.tar.gz --clobber
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload examples and test framework artifact
      if: matrix.build-configuration == 'Distribution'
      uses: actions/upload-artifact@v4
      with:
        name: dingo-programs-linux-distribution-${{steps.version.outputs.VERSION}}
        path: build/package/programs/*.tar.gz
        compression-level: 0
