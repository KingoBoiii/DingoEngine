name: Build Windows

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: read

env:
  SOLUTION_FILE_PATH: 'DingoEngine.slnx'

jobs:
  build-windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        build-configuration: [Debug, Release, Distribution]
        profile: [false]
        # Tracy (premake --profile) only compiles in a build that asks for it, so one build keeps it compiling.
        include:
          - build-configuration: Release
            profile: true
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        lfs: true
        fetch-depth: 0

    - uses: ./.github/actions/setup-windows
      with:
        msbuild: true

    - name: Get version
      id: version
      run: |
        $base = (Get-Content VERSION).Trim()
        $parts = $base.Split('.')
        $commits = git rev-list --count HEAD
        echo "VERSION=$base.$commits" >> $env:GITHUB_OUTPUT
        echo "VERSION_MAJOR=$($parts[0])" >> $env:GITHUB_OUTPUT
        echo "VERSION_MINOR=$($parts[1])" >> $env:GITHUB_OUTPUT
        echo "VERSION_PATCH=$($parts[2])" >> $env:GITHUB_OUTPUT
        echo "VERSION_BUILD=$commits" >> $env:GITHUB_OUTPUT

    - name: Premake
      working-directory: ${{env.GITHUB_WORKSPACE}}
      env:
        DE_BUILD_NUMBER: ${{steps.version.outputs.VERSION_BUILD}}
      run: premake5 ${{ matrix.profile && '--profile' || '' }} vs2026

    - name: Build
      working-directory: ${{env.GITHUB_WORKSPACE}}
      run: msbuild ${{env.SOLUTION_FILE_PATH}} /m /p:Configuration=${{matrix.build-configuration}} /p:PlatformToolset=v143 -fl -flp:logfile=logs/Build-${{matrix.build-configuration}}.log

    # Ship the self-contained lib (engine + all vendor libs merged by the
    # lib.exe post-build step) instead of the engine-only lib.
    - name: Use merged self-contained lib
      run: Copy-Item ".\build\dist\${{matrix.build-configuration}}-windows-x86_64\DingoEngine.lib" ".\build\bin\${{matrix.build-configuration}}-windows-x86_64\DingoEngine\DingoEngine.lib" -Force

    - name: Upload static library artifact
      if: ${{ !matrix.profile }}
      uses: actions/upload-artifact@v4
      with:
        name: dingo-engine-windows-${{matrix.build-configuration}}-${{steps.version.outputs.VERSION}}
        path: |
          build/bin/${{matrix.build-configuration}}-windows-x86_64/DingoEngine/DingoEngine.lib
          include/

    - name: Copy test assets
      if: matrix.build-configuration == 'Distribution'
      run: |
        robocopy .\test\assets .\build\bin\Distribution-windows-x86_64\Dingo-TestFramework\assets /e /z
        if ($lastexitcode -lt 8) { exit 0 } else { exit 1 }

    - name: Copy imgui.ini
      if: matrix.build-configuration == 'Distribution'
      run: |
        robocopy .\test .\build\bin\Distribution-windows-x86_64\Dingo-TestFramework imgui.ini
        if ($lastexitcode -lt 8) { exit 0 } else { exit 1 }

    - name: Upload test framework artifacts
      if: matrix.build-configuration == 'Distribution'
      uses: actions/upload-artifact@v4
      with:
        name: dingo-testframework-windows-distribution
        path: .\build\bin\Distribution-windows-x86_64\Dingo-TestFramework

    # GitHub's Windows runners have no GPU: D3D11 and D3D12 run on WARP. Checks only, never timings.
    - name: Checks on WARP
      if: matrix.build-configuration == 'Release' && !matrix.profile
      run: .\scripts\ci\windows-smoke-test.ps1 -Config Release -Tournament

    - name: Upload smoke-test logs
      if: always() && matrix.build-configuration == 'Release' && !matrix.profile
      uses: actions/upload-artifact@v4
      with:
        name: smoke-test-logs-windows-Release
        path: build/smoke/
        if-no-files-found: ignore
