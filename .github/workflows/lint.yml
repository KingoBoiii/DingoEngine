name: Lint

on:
  pull_request:
    paths:
      - '**.c'
      - '**.cpp'
      - '**.h'
      - '**.hpp'
      - '**.inl'
      - '**/premake5.lua'
      - 'scripts/ci/lint-changed.sh'
      - 'scripts/embed.lua'
      - '.github/workflows/lint.yml'

permissions:
  contents: read

concurrency:
  group: lint-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux (GCC)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
    # Depth 2 brings the merge commit's base parent, which the script diffs against.
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 2

    - uses: ./.github/actions/setup-linux

    - name: Premake
      run: premake5 --lint gmake

    - name: Lint changed files
      run: bash scripts/ci/lint-changed.sh

    - name: Upload lint log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: lint-linux
        path: build/lint/
        if-no-files-found: ignore

  windows:
    name: Windows (MSVC)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 2

    - name: Get Vulkan SDK version
      id: vulkan
      run: |
        $version = (Invoke-WebRequest -Uri "https://vulkan.lunarg.com/sdk/latest/windows.txt").Content.Trim()
        echo "version=$version" >> $env:GITHUB_OUTPUT

    # Same key as build-windows.yml, so a PR restores the SDK that master's builds cached.
    - name: Cache Vulkan SDK
      id: cache-vulkan
      uses: actions/cache@v4
      with:
        path: C:\VulkanSDK\${{ steps.vulkan.outputs.version }}
        key: vulkan-sdk-windows-${{ steps.vulkan.outputs.version }}-debug

    - name: Install Vulkan SDK
      if: steps.cache-vulkan.outputs.cache-hit != 'true'
      run: |
        $version = "${{ steps.vulkan.outputs.version }}"
        $installer = "vulkansdk-windows-X64-$version.exe"
        Invoke-WebRequest -Uri "https://sdk.lunarg.com/sdk/download/$version/windows/$installer" -OutFile $installer
        Start-Process -FilePath ".\$installer" -ArgumentList "--accept-licenses --default-answer --confirm-command install com.lunarg.vulkan.debug" -Wait

    - name: Set VULKAN_SDK environment variable
      run: echo "VULKAN_SDK=C:\VulkanSDK\${{ steps.vulkan.outputs.version }}" >> $env:GITHUB_ENV

    - name: Premake
      run: .\vendor\premake\bin\premake5.exe --lint vs2026

    - name: Lint changed files
      shell: bash
      env:
        LINT_MSBUILD_ARGS: -p:PlatformToolset=v143
      run: bash scripts/ci/lint-changed.sh

    - name: Upload lint log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: lint-windows
        path: build/lint/
        if-no-files-found: ignore
