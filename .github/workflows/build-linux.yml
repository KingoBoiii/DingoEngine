name: Build Linux

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        build-configuration: [Debug, Debug-ASan, Release, Distribution]
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        lfs: true

    - uses: ./.github/actions/setup-linux
      with:
        runtime: true

    - name: Premake
      run: premake5 gmake

    - name: Build
      run: make -j"$(nproc)" config="$(echo '${{ matrix.build-configuration }}' | tr '[:upper:]' '[:lower:]')"

    - name: Smoke test
      run: xvfb-run -a -s "-screen 0 1920x1080x24" scripts/ci/linux-smoke-test.sh ${{ matrix.build-configuration }}

    - name: Upload smoke-test logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: smoke-test-logs-linux-${{ matrix.build-configuration }}
        path: build/smoke/
        if-no-files-found: ignore
