name: Build

on:
  push:
    branches: [ "master" ]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.claude/**'
      - 'VERSION'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:

permissions:
  contents: read

# Master runs are never cancelled or replaced while pending: a tag gate may need any merge commit's run.
# The called workflows must not set their own concurrency: they would share this group and deadlock.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/master' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  windows:
    uses: ./.github/workflows/build-windows.yml

  linux:
    uses: ./.github/workflows/build-linux.yml
