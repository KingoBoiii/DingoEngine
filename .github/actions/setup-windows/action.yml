name: Set up a Windows build
description: >
  Installs the Vulkan SDK (LunarG's installer, with the debug libraries the Debug configurations link)
  and premake, and puts premake5 on PATH. With msbuild, also puts MSBuild on PATH.

inputs:
  msbuild:
    description: Put MSBuild on PATH
    default: 'false'
  premake-version:
    default: '5.0.0-beta8'

runs:
  using: composite
  steps:
  - name: Set up MSBuild
    if: inputs.msbuild == 'true'
    uses: microsoft/setup-msbuild@v1.1
    with:
      msbuild-architecture: x64

  - name: Get Vulkan SDK version
    id: vulkan
    shell: pwsh
    run: |
      $version = (Invoke-WebRequest -Uri "https://vulkan.lunarg.com/sdk/latest/windows.txt").Content.Trim()
      echo "version=$version" >> $env:GITHUB_OUTPUT

  - name: Cache Vulkan SDK
    id: cache-vulkan
    uses: actions/cache@v4
    with:
      path: C:\VulkanSDK\${{ steps.vulkan.outputs.version }}
      key: vulkan-sdk-windows-${{ steps.vulkan.outputs.version }}-debug

  - name: Install Vulkan SDK
    if: steps.cache-vulkan.outputs.cache-hit != 'true'
    shell: pwsh
    run: |
      $version = "${{ steps.vulkan.outputs.version }}"
      $installer = "vulkansdk-windows-X64-$version.exe"
      Invoke-WebRequest -Uri "https://sdk.lunarg.com/sdk/download/$version/windows/$installer" -OutFile $installer
      Start-Process -FilePath ".\$installer" -ArgumentList "--accept-licenses --default-answer --confirm-command install com.lunarg.vulkan.debug" -Wait
      Remove-Item $installer

  - name: Set Vulkan SDK environment
    shell: pwsh
    run: echo "VULKAN_SDK=C:\VulkanSDK\${{ steps.vulkan.outputs.version }}" >> $env:GITHUB_ENV

  - name: Install premake
    shell: pwsh
    run: |
      $dir = Join-Path $env:RUNNER_TEMP premake
      $zip = Join-Path $env:RUNNER_TEMP premake.zip
      Invoke-WebRequest -Uri "https://github.com/premake/premake-core/releases/download/v${{ inputs.premake-version }}/premake-${{ inputs.premake-version }}-windows.zip" -OutFile $zip
      Expand-Archive -Path $zip -DestinationPath $dir -Force
      echo $dir >> $env:GITHUB_PATH
